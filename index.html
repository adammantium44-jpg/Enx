<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POE Farm Expense Calculator (Manual)</title>
    <style>
        body {
            background-color: #0b0c0e;
            color: #c8c8c8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .calculator-card {
            background-color: #181a20;
            border: 2px solid #5a4831;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
            width: 100%;
            max-width: 650px;
            padding: 25px;
            box-sizing: border-box;
        }

        h2 {
            color: #af6025;
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            text-shadow: 0 0 8px rgba(175, 96, 37, 0.4);
            border-bottom: 1px solid #332619;
            padding-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .table-header {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            font-weight: bold;
            color: #a38d6d;
            font-size: 0.9em;
            padding-bottom: 5px;
            border-bottom: 1px solid #282017;
        }

        .row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .col-name { flex: 2; }
        .col-qty { flex: 1; }
        .col-price { flex: 1; }
        .col-total { flex: 1; text-align: right; }

        input {
            width: 100%;
            padding: 8px 10px;
            background-color: #0b0c0e;
            border: 1px solid #3d3122;
            color: #e0e0e0;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 0.95em;
        }

        input:focus {
            outline: none;
            border-color: #af6025;
            box-shadow: 0 0 5px rgba(175, 96, 37, 0.5);
        }

        .item-subtotal {
            color: #e5b158;
            font-weight: bold;
            font-size: 0.95em;
        }

        .summary-box {
            margin-top: 25px;
            background-color: #0b0c0e;
            border: 1px solid #3d3122;
            border-radius: 6px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .summary-title {
            color: #a38d6d;
            font-size: 1.1em;
            font-weight: bold;
        }

        .total-expense {
            color: #ff4d4d;
            font-size: 1.4em;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(255, 77, 77, 0.3);
        }

        .btn-reset {
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            background: linear-gradient(to bottom, #4a210d, #2d1408);
            border: 1px solid #7e3e1b;
            color: #a38d6d;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-reset:hover {
            background: linear-gradient(to bottom, #7e3e1b, #4a210d);
            color: #fff;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <h2>Catatan Modal Farming</h2>

    <!-- Header Kolom -->
    <div class="table-header">
        <div class="col-name">Nama Item / Scarab</div>
        <div class="col-qty">Jumlah (Qty)</div>
        <div class="col-price">Harga (@ Chaos)</div>
        <div class="col-total">Subtotal</div>
    </div>

    <!-- Container 6 Baris Input -->
    <div id="itemRows"></div>

    <!-- Ringkasan Total Modal -->
    <div class="summary-box">
        <span class="summary-title">TOTAL MODAL DIKELUARKAN:</span>
        <span class="total-expense" id="grandTotal">0 Chaos</span>
    </div>

    <button class="btn-reset" onclick="resetForm()">Reset Semua Input</button>
</div>

<script>
    // Membuat 6 Baris Input Secara Otomatis
    const container = document.getElementById('itemRows');
    
    for (let i = 1; i <= 6; i++) {
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `
            <div class="col-name">
                <input type="text" id="name_${i}" placeholder="Slot ${i} (misal: Ambush Scarab)">
            </div>
            <div class="col-qty">
                <input type="number" id="qty_${i}" value="0" min="0" oninput="hitungTotal()">
            </div>
            <div class="col-price">
                <input type="number" id="price_${i}" value="0" min="0" step="any" oninput="hitungTotal()">
            </div>
            <div class="col-total">
                <span class="item-subtotal" id="subtotal_${i}">0 c</span>
            </div>
        `;
        container.appendChild(row);
    }

    // Fungsi Kalkulasi Real-Time
    function hitungTotal() {
        let totalModal = 0;

        for (let i = 1; i <= 6; i++) {
            const qty = parseFloat(document.getElementById(`qty_${i}`).value) || 0;
            const price = parseFloat(document.getElementById(`price_${i}`).value) || 0;
            
            const subtotal = qty * price;
            totalModal += subtotal;

            // Format angka subtotal per baris
            document.getElementById(`subtotal_${i}`).innerText = `${subtotal.toLocaleString('id-ID')} c`;
        }

        // Update Total Keseluruhan
        document.getElementById('grandTotal').innerText = `${totalModal.toLocaleString('id-ID')} Chaos`;
    }

    // Fungsi Reset
    function resetForm() {
        for (let i = 1; i <= 6; i++) {
            document.getElementById(`name_${i}`).value = '';
            document.getElementById(`qty_${i}`).value = '0';
            document.getElementById(`price_${i}`).value = '0';
        }
        hitungTotal();
    }
</script>

</body>
</html>
