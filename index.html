<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POE Farm Expense Calculator</title>
    <style>
        body {
            background-color: #0b0c0e;
            color: #c8c8c8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .calculator-card {
            background-color: #181a20;
            border: 2px solid #5a4831;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
            width: 100%;
            max-width: 700px;
            padding: 25px;
            box-sizing: border-box;
        }

        h2, h3 {
            color: #af6025;
            text-align: center;
            margin-top: 0;
            margin-bottom: 15px;
            text-shadow: 0 0 8px rgba(175, 96, 37, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h3 {
            font-size: 1.05em;
            color: #e5b158;
            margin-top: 25px;
            border-bottom: 1px solid #332619;
            padding-bottom: 8px;
            text-align: left;
        }

        .table-header {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            font-weight: bold;
            color: #a38d6d;
            font-size: 0.88em;
            padding-bottom: 5px;
            border-bottom: 1px solid #282017;
        }

        .row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            align-items: center;
        }

        .col-name { flex: 2; }
        .col-qty { flex: 0.9; }
        .col-ratio { flex: 1; }
        .col-price { flex: 1.1; }

        input {
            width: 100%;
            padding: 8px 10px;
            background-color: #0b0c0e;
            border: 1px solid #3d3122;
            color: #e0e0e0;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 0.9em;
        }

        input[readonly] {
            background-color: #12141a;
            color: #af6025;
            border-color: #2a2218;
            font-weight: bold;
            cursor: not-allowed;
        }

        input:focus:not([readonly]) {
            outline: none;
            border-color: #af6025;
            box-shadow: 0 0 5px rgba(175, 96, 37, 0.5);
        }

        .wild { color: #e040fb !important; }
        .vivid { color: #ffd700 !important; }
        .primal { color: #00e5ff !important; }

        .summary-box {
            margin-top: 25px;
            background-color: #0b0c0e;
            border: 1px solid #3d3122;
            border-radius: 6px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .summary-title {
            color: #a38d6d;
            font-size: 1.1em;
            font-weight: bold;
        }

        .total-expense {
            color: #ff4d4d;
            font-size: 1.4em;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(255, 77, 77, 0.3);
        }

        .btn-reset {
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            background: linear-gradient(to bottom, #4a210d, #2d1408);
            border: 1px solid #7e3e1b;
            color: #a38d6d;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-reset:hover {
            background: linear-gradient(to bottom, #7e3e1b, #4a210d);
            color: #fff;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <h2>Catatan Modal Farming</h2>

    <!-- Header Slot Utama -->
    <div class="table-header">
        <div class="col-name">Nama Item</div>
        <div class="col-qty">Qty</div>
        <div class="col-ratio" style="visibility: hidden;">-</div>
        <div class="col-price">Total Harga (Chaos)</div>
    </div>

    <!-- Container Slot Utama -->
    <div id="itemRows"></div>

    <!-- Section Khusus Harvest Lifeforce -->
    <h3>🌱 Harvest Lifeforce</h3>

    <div class="table-header">
        <div class="col-name">Tipe Lifeforce</div>
        <div class="col-qty">Qty LF</div>
        <div class="col-ratio">Rasio (1c : LF)</div>
        <div class="col-price">Hasil (Chaos)</div>
    </div>
    
    <div id="lifeforceRows"></div>

    <!-- Ringkasan Total Modal -->
    <div class="summary-box">
        <span class="summary-title">TOTAL MODAL DIKELUARKAN:</span>
        <span class="total-expense" id="grandTotal">0 Chaos</span>
    </div>

    <button class="btn-reset" onclick="resetForm()">Reset Semua Input</button>
</div>

<script>
    // Slot Map & Scarab Utama
    const fixedItems = [
        "Scarab of Monstrous Lineage",
        "Sacrifice of Dust",
        "Sacrifice of Noon",
        "Sacrifice of Midnight",
        "Sacrifice of Dawn",
        "MAP"
    ];

    // Slot Harvest Lifeforce
    const lifeforceItems = [
        { name: "Wild Crystallised Lifeforce", class: "wild" },
        { name: "Vivid Crystallised Lifeforce", class: "vivid" },
        { name: "Primal Crystallised Lifeforce", class: "primal" },
        { name: "Sacred Crystallised Lifeforce", class: "vivid" }
    ];

    const container = document.getElementById('itemRows');
    const lfContainer = document.getElementById('lifeforceRows');

    // 1. Render Slot Utama
    fixedItems.forEach((itemName, index) => {
        const i = index + 1;
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `
            <div class="col-name">
                <input type="text" id="name_${i}" value="${itemName}" readonly>
            </div>
            <div class="col-qty">
                <input type="number" id="qty_${i}" placeholder="Qty" min="0">
            </div>
            <div class="col-ratio" style="visibility: hidden;">
                <input type="text" disabled>
            </div>
            <div class="col-price">
                <input type="number" id="price_${i}" placeholder="0 c" min="0" step="any" oninput="hitungTotal()">
            </div>
        `;
        container.appendChild(row);
    });

    // 2. Render Slot Lifeforce (dengan input Rasio masing-masing)
    lifeforceItems.forEach((lf, index) => {
        const i = index + 1;
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `
            <div class="col-name">
                <input type="text" value="${lf.name}" class="${lf.class}" readonly>
            </div>
            <div class="col-qty">
                <input type="number" id="lf_qty_${i}" placeholder="Qty LF" min="0" oninput="hitungLifeforce(${i})">
            </div>
            <div class="col-ratio">
                <input type="number" id="lf_ratio_${i}" placeholder="Rasio LF" min="0" step="any" oninput="hitungLifeforce(${i})">
            </div>
            <div class="col-price">
                <input type="number" id="lf_price_${i}" placeholder="0 c" min="0" step="any" oninput="hitungTotal()">
            </div>
        `;
        lfContainer.appendChild(row);
    });

    // Kalkulasi per Baris Lifeforce (Qty / Rasio Khusus Baris Ini)
    function hitungLifeforce(index) {
        const qty = parseFloat(document.getElementById(`lf_qty_${index}`).value) || 0;
        const ratio = parseFloat(document.getElementById(`lf_ratio_${index}`).value) || 0;
        const priceInput = document.getElementById(`lf_price_${index}`);

        if (ratio > 0 && qty > 0) {
            const resultChaos = qty / ratio;
            priceInput.value = resultChaos.toFixed(2);
        } else {
            priceInput.value = '';
        }
        hitungTotal();
    }

    // Hitung Total Modal Keseluruhan
    function hitungTotal() {
        let totalModal = 0;

        // Total dari Slot Utama
        for (let i = 1; i <= fixedItems.length; i++) {
            const price = parseFloat(document.getElementById(`price_${i}`).value) || 0;
            totalModal += price;
        }

        // Total dari Lifeforce
        for (let i = 1; i <= lifeforceItems.length; i++) {
            const lfPrice = parseFloat(document.getElementById(`lf_price_${i}`).value) || 0;
            totalModal += lfPrice;
        }

        document.getElementById('grandTotal').innerText = `${totalModal.toLocaleString('id-ID', { minimumFractionDigits: 0, maximumFractionDigits: 2 })} Chaos`;
    }

    // Reset Form
    function resetForm() {
        for (let i = 1; i <= fixedItems.length; i++) {
            document.getElementById(`qty_${i}`).value = '';
            document.getElementById(`price_${i}`).value = '';
        }
        for (let i = 1; i <= lifeforceItems.length; i++) {
            document.getElementById(`lf_qty_${i}`).value = '';
            document.getElementById(`lf_ratio_${i}`).value = '';
            document.getElementById(`lf_price_${i}`).value = '';
        }
        hitungTotal();
    }
</script>

</body>
</html>
